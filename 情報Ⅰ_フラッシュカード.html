<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情報Ⅰ フラッシュカード 160枚</title>
  <style>
    :root { --ink:#182235; --accent:#2563eb; --paper:#fff; --bg:#eef4ff; --gold:#f59e0b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic UI","Yu Gothic",Meiryo,sans-serif; }
    header { max-width:920px; margin:0 auto; padding:30px 22px 14px; }
    h1 { margin:0; font-size:clamp(1.55rem,4vw,2.3rem); }
    .subtitle { margin:.4rem 0 0; color:#536277; }
    main { max-width:920px; margin:auto; padding:12px 22px 42px; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:12px 0 20px; }
    button { border:0; border-radius:10px; padding:10px 14px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:#dbe7ff; color:#193b75; }
    button:hover { filter:brightness(.94); }
    #progress { margin-left:auto; font-weight:700; color:#3b4b63; }
    .hint { color:#536277; font-size:.92rem; margin:0 0 12px; }
    .stage { perspective:1400px; min-height:420px; }
    .card { position:relative; width:100%; min-height:420px; transform-style:preserve-3d; transition:transform .55s ease; cursor:pointer; }
    .card.flipped { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; background:var(--paper); border-radius:22px; box-shadow:0 14px 35px #1e3a5f22; backface-visibility:hidden; padding:clamp(28px,7vw,64px); display:flex; flex-direction:column; justify-content:center; }
    .back { transform:rotateY(180deg); justify-content:flex-start; overflow:auto; }
    .meta { font-size:.9rem; font-weight:700; color:#46618c; letter-spacing:.04em; }
    .stars { color:var(--gold); font-size:1.3rem; margin:12px 0 6px; }
    .term { font-size:clamp(2rem,7vw,4.4rem); line-height:1.25; margin:0; word-break:keep-all; }
    .tap { margin-top:30px; color:#69788c; font-size:.92rem; }
    .definition { font-size:clamp(1.15rem,2.3vw,1.45rem); line-height:1.85; margin:12px 0 18px; }
    .example { background:#f0f6ff; border-left:5px solid var(--accent); border-radius:8px; padding:15px 18px; line-height:1.75; }
    .memory { margin-top:14px; background:#fff7e6; border-radius:8px; padding:12px 16px; line-height:1.6; }
    .all { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .mini { background:#fff; border-radius:14px; box-shadow:0 5px 16px #1e3a5f18; padding:20px; break-inside:avoid; }
    .mini h2 { margin:0 0 8px; font-size:1.25rem; }
    .mini p { line-height:1.65; }
    .hidden { display:none; }
    @media print { body { background:#fff; } header,.controls,.hint,.stage { display:none!important; } main { max-width:none; padding:0; } .all { display:grid!important; grid-template-columns:repeat(2,1fr); gap:10mm; } .mini { box-shadow:none; border:1px solid #888; border-radius:0; min-height:72mm; padding:8mm; } }
  </style>
</head>
<body>
  <header>
    <h1>情報Ⅰ フラッシュカード 160枚</h1>
    <p class="subtitle">情報社会・法律・情報モラル／情報セキュリティ</p>
  </header>
  <main>
    <div class="controls">
      <button id="prev" class="secondary">← 前へ</button>
      <button id="flip">表／裏を切替</button>
      <button id="next" class="secondary">次へ →</button>
      <button id="random" class="secondary">ランダム</button>
      <button id="toggleAll" class="secondary">一覧・印刷用表示</button>
      <span id="progress"></span>
    </div>
    <p class="hint" id="hint">カードをクリック、または「表／裏を切替」で答えを確認できます。キーボードの ← → でも移動できます。</p>
    <section class="stage" id="studyView">
      <article class="card" id="card" aria-label="フラッシュカード。クリックして裏面を表示。">
        <div class="face front"><div class="meta" id="frontMeta"></div><div class="stars" id="frontStars"></div><h2 class="term" id="term"></h2><p class="tap">クリックして意味・具体例を見る</p></div>
        <div class="face back"><div class="meta" id="backMeta"></div><div class="stars" id="backStars"></div><p class="definition" id="definition"></p><div class="example" id="example"></div><div class="memory hidden" id="memory"></div></div>
      </article>
    </section>
    <section class="all hidden" id="allView" aria-label="全カード一覧"></section>
  </main>
  <script>
    const cards = [
      ["知的財産権","★★★","人間の知的な創作活動によって生み出されたものを保護する権利の総称。","著作権・特許権・商標権などが含まれる。"],
      ["著作権","★★★","小説・音楽・写真・プログラムなどの著作物を作った人に与えられる権利。","他人が撮影した写真を、許可なく自分のWebサイトに掲載してはいけない。"],
      ["著作者人格権","★★","著作者の人格的な利益を守る権利。譲渡することができない。","作者の意図に反して作品を勝手に改変することが問題になる。"],
      ["特許権","★★","新しい発明を一定期間、独占的に利用できる権利。","新しい機械の仕組みを発明し、特許を取得する。"],
      ["商標権","★★","商品やサービスを識別する名称・ロゴなどを保護する権利。","他社が有名企業のブランドロゴを勝手に商品へ使用できない。"],
      ["意匠権","★","製品などのデザインを保護する権利。","独創的な家具や家電製品の外観デザインを保護する。"],
      ["個人情報","★★★","氏名などによって、特定の個人を識別できる情報。","氏名・住所・生年月日の組合せから特定の人物が分かる。"],
      ["個人情報保護法","★★","個人情報を適切に取り扱うためのルールを定めた法律。","企業が集めた顧客情報を、本人の同意なく目的外に使用しない。"],
      ["プライバシー","★★","私生活上の情報を、みだりに公開されないための権利・利益。","本人の許可なく住所や私生活についてSNSで公開しない。"],
      ["肖像権","★★","自分の顔や姿を無断で撮影・公開されないための権利。","他人の顔がはっきり写った写真を、許可なくSNSに掲載しない。"],
      ["情報格差（デジタルデバイド）","★★","ICTを利用できる人と利用できない人の間に生じる格差。","オンライン手続きしか用意されておらず、インターネットを利用できない人が手続きしにくくなる。"],
      ["情報リテラシー","★★","情報を適切に収集・判断・活用する能力。","SNSの情報をそのまま信じず、複数の情報源を確認する。"],
      ["情報の信頼性","★★★","情報がどの程度信用できるかという性質。","SNSの匿名投稿だけでなく、公的機関や一次情報も確認する。"],
      ["一次情報","★★","調査・実験・当事者の発表など、情報源から直接得られた情報。","政府が公開した統計資料そのものを確認する。"],
      ["情報モラル","★★","情報社会で適切に行動するための考え方や態度。","SNSで他人を誹謗中傷したり、個人情報を勝手に公開したりしない。"],
      ["機密性","★★★","許可された人だけが情報を利用できる状態。","パスワードを設定し、関係者以外がファイルを閲覧できないようにする。","覚え方：「見せない」"],
      ["完全性","★★★","情報が正確で、改ざんや破壊がされていない状態。","ハッシュ値を確認して、ファイルが変更されていないか調べる。","覚え方：「変えさせない」"],
      ["可用性","★★★","必要なときに情報やシステムを利用できる状態。","サーバを複数台用意して、1台故障してもサービスを継続する。","覚え方：「使えなくさせない」"],
      ["認証","★★★","利用しようとしている人物が本人であることを確認すること。","IDとパスワードを入力してログインする。"],
      ["知識認証","★★","本人だけが知っている情報による認証。","パスワードや暗証番号。"],
      ["所有物認証","★★","本人が持っている物を利用する認証。","ICカードやスマートフォンに届く認証コード。"],
      ["生体認証","★★","人間の身体的特徴を利用した認証。","指紋認証、顔認証、虹彩認証。"],
      ["多要素認証","★★★","異なる種類の認証要素を複数組み合わせる方法。","パスワード＋スマートフォンによる認証。","注意：パスワードを2種類使っても、どちらも「知識」なので多要素認証とは限らない。"],
      ["暗号化","★★★","第三者に内容を読まれないよう、データを変換すること。","HTTPSを利用して、Webサーバとの通信内容を暗号化する。"],
      ["共通鍵暗号方式","★★★","暗号化と復号に同じ鍵を使用する方式。","AさんとBさんが同じ秘密の鍵を共有して通信する。","特徴：処理は比較的高速だが、鍵を安全に渡す必要がある。"],
      ["公開鍵暗号方式","★★★","公開鍵と秘密鍵という異なる2つの鍵を使用する方式。","Bさんに秘密の情報を送りたい場合、Bさんの公開鍵で暗号化し、Bさんの秘密鍵で復号する。"],
      ["公開鍵","★★★","他人に公開してよい鍵。","Bさん宛てのデータを暗号化するとき、送信者がBさんの公開鍵を使用する。"],
      ["秘密鍵","★★★","所有者本人だけが厳重に管理する鍵。","自分の公開鍵で暗号化されたデータを、自分の秘密鍵で復号する。"],
      ["デジタル署名（電子署名）","★★★","データの送信者が本人であることや、内容が改ざんされていないことを確認する仕組み。","送信者が自分の秘密鍵を使って署名し、受信者が送信者の公開鍵を使って確認する。"],
      ["ハッシュ関数","★★★","データから一定の規則で固定長の値（ハッシュ値）を生成する関数。元のデータが少し変わるだけでも値が大きく変化する。","ダウンロードしたファイルのハッシュ値を比較して、改ざんされていないか確認する。"],
      ["ファイアウォール","★★","ネットワークを通る通信を監視し、ルールに基づいて許可・拒否する仕組み。","外部から社内ネットワークへの不審な通信を遮断する。"],
      ["マルウェア","★★★","コンピュータや利用者に害を与える悪意あるソフトウェアの総称。","コンピュータウイルス、ワーム、ランサムウェアなど。"],
      ["コンピュータウイルス","★★","他のプログラムやファイルに寄生して感染を広げるマルウェア。","不審なメールの添付ファイルを開いたことで感染する。"],
      ["ワーム","★★","他のプログラムに寄生せず、自分自身を複製してネットワークなどを通じて感染を広げるマルウェア。","感染したPCからネットワーク上の別のPCへ自動的に感染する。"],
      ["ランサムウェア","★★★","ファイルなどを利用不能にして、復旧と引き換えに金銭を要求するマルウェア。","PC内のファイルを暗号化し、「元に戻したければ金を払え」と要求する。"],
      ["フィッシング","★★★","偽メールや偽Webサイトなどを使って、ID・パスワードなどを盗む手口。","銀行を装ったメールから偽ログイン画面へ誘導する。"],
      ["ソーシャルエンジニアリング","★★","コンピュータの技術的な弱点ではなく、人間の心理や行動の隙を利用して情報を盗む手法。","社員になりすまして電話し、パスワードを聞き出す。"],
      ["パスワードリスト攻撃","★★","他のサービスから流出したIDとパスワードの組合せを使って、不正ログインを試みる攻撃。","同じパスワードを複数サイトで使い回していたため、別のサービスにも侵入される。"],
      ["総当たり攻撃（ブルートフォース攻撃）","★★","考えられるパスワードの組合せを順番にすべて試す攻撃。","0000 → 0001 → 0002…のように暗証番号を試し続ける。"],
      ["DoS攻撃","★★","大量の通信などを送り、サーバやサービスを利用できなくする攻撃。","Webサーバに大量のアクセスを集中させて応答できなくする。"]
    ];
    cards.push(
      ["IPアドレス","★★★","ネットワーク上の機器を識別するための番号。","192.168.1.10のようなアドレスを使って通信相手を識別する。"],
      ["IPv4","★★★","32ビットでIPアドレスを表す方式。","192.168.0.1のように、通常は10進数を4つ並べて表記する。"],
      ["IPv6","★★","128ビットでIPアドレスを表す方式。IPv4より非常に多くのアドレスを扱える。","IoT機器などインターネット接続機器の増加に対応する。"],
      ["DNS","★★★","ドメイン名とIPアドレスを対応付ける仕組み。","www.example.comに対応するIPアドレスを調べる。","覚え方：「名前 → IPアドレス」"],
      ["ドメイン名","★★★","インターネット上のコンピュータや組織を人間に分かりやすい文字列で表した名前。","example.com"],
      ["URL","★★★","Web上の情報がどこにあり、どの方法でアクセスするかを示す情報。","https://example.com/index.html"],
      ["プロトコル","★★★","コンピュータ同士が通信するときの決まりや手順。","HTTP、HTTPS、TCP、IP、SMTPなど。"],
      ["HTTP","★★★","Webページなどのデータを送受信するためのプロトコル。","ブラウザがWebサーバからHTMLファイルを受信する。"],
      ["HTTPS","★★★","HTTPによる通信を暗号化して安全性を高めたもの。","ネットショッピングで住所やカード情報を安全に送る。"],
      ["SMTP","★★","電子メールの送信・転送に使われるプロトコル。","メールソフトからメールサーバへメールを送信する。"],
      ["POP","★★","メールサーバから電子メールを受信するためのプロトコル。","サーバにあるメールをPCへダウンロードして読む。"],
      ["IMAP","★★","メールをサーバ上に置いたまま管理・閲覧するためのプロトコル。","PCとスマートフォンの両方で同じ既読状態を共有する。"],
      ["ルータ","★★★","異なるネットワーク同士を接続し、データの転送先を判断する機器。","家庭内LANとインターネットを接続する。"],
      ["LAN","★★","家庭・学校・会社など、比較的狭い範囲のネットワーク。","学校内のPCを同じネットワークで接続する。"],
      ["WAN","★★","離れた場所にあるLAN同士などを結ぶ広域ネットワーク。","東京本社と大阪支社のネットワークを接続する。"],
      ["パケット","★★","ネットワークでデータを送る際に分割した小さな単位。","大きな画像データを複数のパケットに分けて送信する。"],
      ["帯域幅","★★","通信回線が一定時間に転送できるデータ量の大きさ。","100Mbpsより1Gbpsの回線の方が多くのデータを送れる。"],
      ["情報デザイン","★★★","情報を目的や利用者に応じて、分かりやすく伝えるために設計すること。","駅の案内を文字・色・図を使って見やすくする。"],
      ["ピクトグラム","★★★","情報を簡単な絵や記号で表現したもの。","非常口、トイレ、車椅子マークなど。"],
      ["ユーザインタフェース（UI）","★★★","人間とコンピュータが情報をやり取りするための接点。","アプリのボタン、メニュー、入力欄など。"],
      ["ユーザビリティ","★★★","製品やサービスの使いやすさ。","よく使う機能を分かりやすい位置に配置する。"],
      ["アクセシビリティ","★★★","年齢や障害などにかかわらず、情報やサービスを利用できるようにする考え方。","画像に代替テキストを設定して、音声読み上げに対応する。"],
      ["ユニバーサルデザイン","★★","最初からできるだけ多くの人が利用しやすいように設計する考え方。","言語に依存しにくいピクトグラムを公共施設で利用する。"],
      ["視認性","★★","文字や図などの情報を見つけやすく、認識しやすい性質。","白い背景に薄い黄色の文字ではなく、十分なコントラストを確保する。"],
      ["色覚への配慮","★★","色の見え方が異なる人にも情報が伝わるようにすること。","赤と緑だけで区別せず、文字や模様も併用する。"],
      ["アナログデータ","★★★","連続的に変化する量として表現されるデータ。","人の声や気温など、連続して変化する情報。"],
      ["デジタルデータ","★★★","情報を離散的な数値として表したデータ。","音声を一定間隔で数値に変換してコンピュータに保存する。"],
      ["標本化（サンプリング）","★★★","アナログ信号を一定の時間間隔で測定すること。","音声を1秒間に44100回測定する。"],
      ["量子化","★★★","標本化した値を、決められた段階の数値に近似すること。","音の大きさを65536段階のいずれかで表す。"],
      ["符号化","★★★","量子化した値などを0と1のビット列として表すこと。","数値27を2進数の11011として保存する。"],
      ["ビット（bit）","★★★","0または1のどちらかを表す、情報量の最小単位。","8ビットなら2^8 = 256通りを表現できる。"],
      ["バイト（byte）","★★★","8ビットをまとめた情報量の単位。","1byte = 8bit。"],
      ["解像度","★★★","画像を構成する画素数など、細かさを表す指標。","1920×1080画素の画像。"],
      ["画素（ピクセル）","★★★","デジタル画像を構成する最小の点。","1920×1080の画像は、1920×1080個の画素から構成される。"],
      ["圧縮","★★","データ量を小さくする処理。","画像をJPEG形式にしてファイルサイズを小さくする。"],
      ["可逆圧縮","★★★","圧縮したデータを完全に元の状態へ戻せる圧縮方式。","ZIP形式で文書ファイルを圧縮する。"],
      ["非可逆圧縮","★★★","一部の情報を削除することで高い圧縮率を得る方式。元のデータに完全には戻せない。","JPEG画像やMP3音声。"],
      ["平均値","★★★","データの値をすべて足し、データ数で割った値。","60、70、80の平均値は70。"],
      ["中央値","★★★","データを大きさの順に並べたとき、中央に位置する値。","10、20、100なら中央値は20。","ポイント：外れ値の影響を平均値より受けにくい。"],
      ["最頻値","★★★","データの中で最も多く現れる値。","1、2、2、2、3なら最頻値は2。"]
    );    cards.push(
      ["分散","★★★","データが平均値からどれくらい散らばっているかを表す指標。","点数が平均点付近に集中していれば分散は小さく、ばらついていれば大きい。"],
      ["標準偏差","★★★","データの散らばり具合を表す指標。分散の平方根で求める。","同じ平均70点でも、標準偏差が小さいクラスの方が点数のばらつきが小さい。"],
      ["外れ値","★★★","他のデータから大きく離れている値。","ほとんどの来店人数が100〜200人なのに、1日だけ1000人だった。"],
      ["欠損値","★★★","本来あるはずのデータが記録されていない状態。","アンケートの年齢欄が空欄になっている。"],
      ["散布図","★★★","2つの量的データの関係を、点を使って表すグラフ。","気温とアイスの売上の関係を調べる。"],
      ["相関関係","★★★","2つのデータが関連して変化する関係。","気温が高くなるほど、アイスの売上も増える傾向がある。"],
      ["正の相関","★★★","一方が大きくなると、もう一方も大きくなる傾向。","勉強時間が増えるほど、テストの点数も高くなる傾向。"],
      ["負の相関","★★★","一方が大きくなると、もう一方が小さくなる傾向。","商品価格が高くなるほど、購入者数が減る傾向。"],

    const $ = id => document.getElementById(id);
    function render() {
      const [term, stars, definition, example, memory] = cards[index];
      $("frontMeta").textContent = `カード ${index + 1} / ${cards.length}`;
      $("backMeta").textContent = `カード ${index + 1} / ${cards.length}`;
      $("frontStars").textContent = stars; $("backStars").textContent = stars;
      $("term").textContent = term;
      $("definition").innerHTML = `<strong>意味：</strong>${definition}`;
      $("example").innerHTML = `<strong>具体例：</strong>${example}`;
      $("memory").textContent = memory || "";
      $("memory").classList.toggle("hidden", !memory);
      $("progress").textContent = `${index + 1} / ${cards.length}`;
      $("card").classList.remove("flipped");
    }
    function move(step) { index = (index + step + cards.length) % cards.length; render(); }
    $("card").onclick = () => $("card").classList.toggle("flipped");
    $("flip").onclick = () => $("card").classList.toggle("flipped");
    $("prev").onclick = () => move(-1); $("next").onclick = () => move(1);
    $("random").onclick = () => { let n; do { n = Math.floor(Math.random() * cards.length); } while (n === index); index = n; render(); };
    $("toggleAll").onclick = () => {
      const showing = !$("allView").classList.contains("hidden");
      $("allView").classList.toggle("hidden", showing); $("studyView").classList.toggle("hidden", !showing);
      $("hint").classList.toggle("hidden", !showing); $("toggleAll").textContent = showing ? "一覧・印刷用表示" : "学習カード表示";
      if (!showing) $("allView").innerHTML = cards.map(([term,stars,definition,example,memory], i) => `<article class="mini"><div class="meta">カード ${i+1} / ${cards.length}　<span class="stars">${stars}</span></div><h2>${term}</h2><p><strong>意味：</strong>${definition}</p><p><strong>具体例：</strong>${example}</p>${memory ? `<p class="memory">${memory}</p>` : ""}</article>`).join("");
    };
    document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") move(-1); if (e.key === "ArrowRight") move(1); if (e.key === " ") { e.preventDefault(); $("card").classList.toggle("flipped"); } });
